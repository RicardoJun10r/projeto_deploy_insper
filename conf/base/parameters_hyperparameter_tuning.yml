# Parameters for pipeline 'hyperparameter_tuning'
# Dataset definitions belong in catalog.yml

tuning:
  cv_folds: 5
  scoring: "f1"
  grids:
    rf:
      n_estimators: [100, 200, 300]
      max_depth: [null, 5, 10]
      min_samples_split: [2, 5, 10]
    lr:
      C: [0.1, 1, 10]
      penalty: ["l1", "l2"]
      solver: ["liblinear"]
    knn:
      n_neighbors: [3, 5, 7]
      weights: ["uniform", "distance"]
    svc:
      C: [0.1, 1, 10]
      kernel: ["linear", "rbf"]
    dt:
      max_depth: [null, 5, 10]
      min_samples_split: [2, 5, 10]
    ada:
      n_estimators: [50, 100, 200]
      learning_rate: [0.1, 0.5, 1.0]
    gbm:
      n_estimators: [50, 100, 200]
      learning_rate: [0.1, 0.5, 1.0]
    xgb:
      n_estimators: [50, 100, 200]
      learning_rate: [0.1, 0.5, 1.0]
    lgbm:
      n_estimators: [50, 100, 200]
      learning_rate: [0.1, 0.5, 1.0]

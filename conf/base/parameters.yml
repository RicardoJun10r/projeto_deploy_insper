columns:
  categorical:
    - "Outcome"
  numerical:
    - "Pregnancies"
    - "Glucose"
    - "BloodPressure"
    - "SkinThickness"
    - "Insulin"
    - "BMI"
    - "DiabetesPedigreeFunction"
    - "Age"
split:
  train: 0.7
  test: 0.15
  validate: 0.15
  random_state: 42

missing_values:
  zero_columns: [Glucose, BloodPressure, SkinThickness, Insulin, BMI]
  knn_neighbors: 5

outliers:
  q1: 0.05
  q3: 0.95

rf_param_grid:
  n_estimators: [100, 200, 300]
  max_depth: [null, 5, 10]
  min_samples_split: [2, 5, 10]

xgb_param_grid:
  n_estimators: [50, 100, 200]
  learning_rate: [0.1, 0.5, 1.0]

lgbm_param_grid:
  n_estimators: [50, 100, 200]
  learning_rate: [0.1, 0.5, 1.0]

cv_folds: 5
